<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로켓 설계기</title>
<script type="importmap">
{
  "imports": {
    "three": "./lib/three/three.module.js",
    "three/addons/": "./lib/three/"
  }
}
</script>
<style>
  :root{
    --bg:#0b0f16; --panel:#121826; --panel-2:#0e1420; --line:#232d40;
    --ink:#e7ecf5; --ink-dim:#8b97b3; --accent:#ff7a35; --accent-2:#57d6ff;
    --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'Cascadia Mono','SFMono-Regular',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-dim);margin:0 0 12px;}
  h3{font-size:12px;color:var(--accent-2);margin:14px 0 6px;}

  .app{display:grid;grid-template-columns:250px 340px 1fr;grid-template-rows:auto 1fr;height:100vh;gap:1px;background:var(--line);}
  header{grid-column:1/-1;background:var(--panel-2);padding:10px 16px;display:flex;align-items:center;gap:16px;}
  header .title{font-weight:700;letter-spacing:.02em;}
  header .subtitle{color:var(--ink-dim);font-size:12px;}

  #palette-panel,#builder-panel,#stats-wrap{background:var(--panel);overflow-y:auto;padding:14px 16px;}
  #scene-wrap{background:var(--panel-2);position:relative;display:flex;flex-direction:column;}
  #export-panel{padding:10px 14px;background:var(--panel-2);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  #scene-canvas{flex:1;width:100%;display:block;}
  #stats-wrap{border-top:1px solid var(--line);max-height:38%;}

  .right-col{display:flex;flex-direction:column;min-height:0;}

  button, .file-import-label{
    font-family:var(--font); font-size:12.5px; padding:7px 12px; border-radius:6px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer;
  }
  button:hover, .file-import-label:hover{ border-color:var(--accent-2); color:var(--accent-2); }
  .export-status{font-size:12px;color:var(--ink-dim);}
  .export-status--ok{color:var(--ok);}
  .export-status--error{color:var(--bad);}

  /* palette */
  .palette-hint{font-size:11px;color:var(--ink-dim);margin:-4px 0 12px;line-height:1.5;}
  .palette-group{margin-bottom:10px;}
  .palette-item{padding:8px 10px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;margin-bottom:6px;cursor:grab;}
  .palette-item:active{cursor:grabbing;}
  .palette-item--dragging{opacity:.4;}
  .palette-item-label{font-weight:600;font-size:12.5px;}
  .palette-item-stat{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);margin-top:3px;}
  .palette-item-note{font-size:10.5px;color:var(--accent-2);margin-top:2px;}

  /* builder */
  .field-row{margin-bottom:10px;display:flex;flex-direction:column;gap:4px;}
  .field-row label{font-size:11.5px;color:var(--ink-dim);}
  input[type=text], input[type=number]{
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:6px 8px;font-family:var(--font);font-size:12.5px;
  }
  select{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:5px 6px;font-size:12px;}
  input[type=range]{accent-color:var(--accent-2);flex:1;}

  .booster-toggle{display:block;margin:10px 0 14px;padding:8px 10px;background:var(--panel-2);border-radius:6px;border:1px solid var(--line);}
  .inline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-dim);margin:8px 0;}

  .stage-card{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px;}
  .stage-card--booster{border-color:var(--accent-2);}
  .stage-card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .stage-label{flex:1;background:transparent;border:none;border-bottom:1px dashed var(--line);color:var(--ink);font-size:13px;font-weight:600;padding:2px 0;}
  .stage-tag{font-size:10px;color:var(--accent);font-family:var(--mono);white-space:nowrap;}
  .stage-remove{padding:2px 7px;font-size:11px;border-radius:5px;}

  .stage-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;}
  .stage-row label{width:96px;flex-shrink:0;color:var(--ink-dim);}
  .stage-row select{flex:1;}
  .engine-count{width:48px;}
  .fill-readout{font-family:var(--mono);font-size:11px;width:34px;text-align:right;}
  .sub-fields{display:flex;gap:10px;margin:4px 0 8px 20px;font-size:11.5px;color:var(--ink-dim);}
  .sub-fields select, .sub-fields input{font-size:11.5px;padding:3px 5px;width:100px;}

  .add-stage{width:100%;margin-top:4px;}

  /* stats */
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .stat{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;}
  .stat-k{font-size:10px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.05em;}
  .stat-v{font-family:var(--mono);font-size:18px;font-weight:700;margin-top:3px;}
  .stat-v.ok{color:var(--ok);} .stat-v.warn{color:var(--warn);} .stat-v.bad{color:var(--bad);}

  .deltav-breakdown{margin-bottom:12px;}
  .deltav-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);padding:3px 0;border-bottom:1px dotted var(--line);}

  .validation{border-radius:8px;padding:10px 12px;font-size:12px;}
  .validation--ok{background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.3);}
  .validation--error{background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.3);}
  .validation-status{font-weight:700;margin-bottom:6px;}
  .validation-msg{padding:2px 0;}
  .validation-msg--error{color:var(--bad);}
  .validation-msg--warn{color:var(--warn);}
</style>
</head>
<body>
  <div class="app">
    <header>
      <span class="title">🚀 로켓 설계기</span>
      <span class="subtitle">부품을 조립해 다단 로켓을 설계하고 .rocket.json으로 내보냅니다</span>
    </header>

    <div id="palette-panel"></div>
    <div id="builder-panel"></div>

    <div class="right-col">
      <div id="export-panel"></div>
      <div id="scene-wrap">
        <canvas id="scene-canvas"></canvas>
      </div>
      <div id="stats-wrap">
        <div id="stats-panel"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
